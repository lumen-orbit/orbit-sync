name: weekly-b

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      part_a:
        description: "Part A"
        type: boolean
        default: true
      hq:
        description: "Part A: narrow"
        type: boolean
        default: false
      retry:
        description: "Part A: retry"
        type: boolean
        default: false
      part_b:
        description: "Part B"
        type: boolean
        default: true
      force:
        description: "Part B: force"
        type: boolean
        default: false
      size:
        description: "Part A: size (0 = all)"
        default: "0"

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_KEY: ${{ secrets.DB_KEY }}
      LOGO_KEY: ${{ secrets.LOGO_KEY }}
      DATA_KEY: ${{ secrets.DATA_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: open
        run: node dist/vault.mjs open
      - name: step a
        if: ${{ github.event_name == 'schedule' || inputs.part_a }}
        run: node dist/charts.mjs
        env:
          IN_HQ: ${{ inputs.hq && 'true' || 'false' }}
          IN_RETRY: ${{ inputs.retry && 'true' || 'false' }}
          IN_SIZE: ${{ inputs.size || '0' }}
      - name: step b
        if: ${{ github.event_name == 'schedule' || inputs.part_b }}
        run: node dist/glyphs.mjs
        env:
          IN_FORCE: ${{ inputs.force && 'true' || 'false' }}
      - name: seal
        id: seal
        run: node dist/vault.mjs seal
      - name: save
        run: |
          date -u +"Last sync: %Y-%m-%d %H:%M UTC" > STATUS.md
          git config user.name "orbit-sync"
          git config user.email "orbit-sync@users.noreply.github.com"
          git add vault.bin STATUS.md
          if ! git diff --cached --quiet; then
            git commit -q -m "sync $(date -u +%Y-%m-%d)"
            git pull -q --rebase && git push -q
          fi
