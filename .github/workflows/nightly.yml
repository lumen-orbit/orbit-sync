name: nightly

on:
  # Three parts an hour apart, each a fixed third of the boards (every board is still read once a day). Part 3 also
  # publishes the snapshot and cleans up. "full" runs every board at once.
  schedule:
    - cron: "23 1 * * *"
    - cron: "23 2 * * *"
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target (optional)"
        default: ""
      notify:
        description: "Notify"
        type: boolean
        default: false
      budget:
        description: "Budget"
        default: "2000"
      lookup:
        description: "Lookup"
        type: boolean
        default: false
      verbose:
        description: "Verbose"
        type: boolean
        default: false
      rebuild:
        description: "Rebuild only"
        type: boolean
        default: false
      part:
        description: "Part"
        type: choice
        default: "all"
        options: ["all", "1/3", "2/3", "3/3"]

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      QUIET_LOGS: ${{ inputs.verbose && '0' || 'warn' }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_KEY: ${{ secrets.DB_KEY }}
      MAIL_KEY: ${{ secrets.MAIL_KEY }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_REPLY: ${{ secrets.MAIL_REPLY }}
      DATA_KEY: ${{ secrets.DATA_KEY }}
      STORE_URL: ${{ secrets.STORE_URL }}
      STORE_ID: ${{ secrets.STORE_ID }}
      STORE_SECRET: ${{ secrets.STORE_SECRET }}
      STORE_PUBLIC: ${{ secrets.STORE_PUBLIC }}
      STORE_PRIVATE: ${{ secrets.STORE_PRIVATE }}
      IN_TARGET: ${{ inputs.target }}
      IN_NOTIFY: ${{ github.event_name == 'schedule' && 'true' || (inputs.notify && 'true' || 'false') }}
      IN_BUDGET: ${{ inputs.budget || '2000' }}
      IN_LOOKUP: ${{ inputs.lookup && '1' || '0' }}
      IN_REBUILD: ${{ inputs.rebuild && '1' || '0' }}
      IN_PART: ${{ github.event.schedule == '23 1 * * *' && '1/3' || github.event.schedule == '23 2 * * *' && '2/3' || github.event.schedule == '23 3 * * *' && '3/3' || inputs.part || 'all' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - name: latest
        # a run that waited behind another starts from the commit it was queued at: take the newest data files
        run: git fetch -q --depth=1 origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: open
        run: node dist/vault.mjs open
      - name: step
        run: node dist/nightly.mjs
      - name: seal
        id: seal
        if: ${{ !cancelled() }}
        run: node dist/vault.mjs seal
      - name: save
        if: ${{ !cancelled() }}
        run: |
          date -u +"Last sync: %Y-%m-%d %H:%M UTC" > STATUS.md
          git config user.name "orbit-sync"
          git config user.email "orbit-sync@users.noreply.github.com"
          git add vault.bin STATUS.md
          if ! git diff --cached --quiet; then
            git commit -q -m "sync $(date -u +%Y-%m-%d)"
            git pull -q --rebase && git push -q
          fi
      - name: notify
        if: ${{ env.IN_PART == 'all' || env.IN_PART == '3/3' }}
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TARGET: ${{ secrets.DISPATCH_TARGET }}
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$TARGET" ] || exit 0
          gh workflow run deploy.yml -R "$TARGET" -f build_only=false > /dev/null
